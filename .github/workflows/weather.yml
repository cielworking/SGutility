name: Update weather and air quality
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update-weather.py
      - scripts/render-weather-pages.py
      - .github/workflows/weather.yml
permissions:
  contents: write
  pages: write
concurrency:
  group: dashboard-data
  cancel-in-progress: false
jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python -m unittest discover -s tests -v
      - run: python scripts/update-weather.py
      - run: python scripts/render-weather-pages.py
      - run: python scripts/render-static-pages.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update weather and air-quality pages"
          file_pattern: data/weather.json index.html singapore/**/*.html malaysia/**/*.html sitemap.xml
      # Commits made with GITHUB_TOKEN do not automatically trigger Pages builds.
      - name: Request GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
